<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="260" viewBox="0 0 1024 260" role="img" aria-labelledby="title description">
  <title id="title">terc</title>
  <desc id="description">A transparent banner with Terc's ASCII wordmark between two pastel traffic waveform illustrations.</desc>
  <style>
    .wordmark { fill: #a65d65; }
    .low { stop-color: #779f99; }
    .mid { stop-color: #c5ae75; }
    .high { stop-color: #bf7580; }
    .pulse { fill: #a65d65; }
    @media (prefers-color-scheme: dark) {
      .wordmark, .pulse { fill: #ffa4a4; }
      .low { stop-color: #badfdb; }
      .mid { stop-color: #fcf9ea; }
      .high { stop-color: #ffa4a4; }
    }
  </style>
  <defs>
    <linearGradient id="spectrum" x1="0" y1="1" x2="0" y2="0">
