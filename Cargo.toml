[package]
name = "terc"
version = "0.1.0"
edition = "2021"
description = "A restrained terminal Mihomo (Clash.Meta) controller and visualizer for macOS."
license = "MIT"
readme = "README.md"
keywords = ["tui", "mihomo", "clash", "proxy", "terminal"]
categories = ["command-line-utilities", "network-programming"]
default-run = "terc"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"
